[platformio]
; `pio run` (no -e) builds only the firmware env, not the native test env below.
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Show timestamps in the serial monitor to correlate with controller actions.
monitor_filters = time, esp32_exception_decoder
lib_deps =
  knolleary/PubSubClient@^2.8
build_flags =
  -Wall
  -Wextra

; OTA upload variant: same firmware, pushed over Wi-Fi with espota instead of
; USB. First flash must still be over USB; after that use `pio run -e
; esp32dev_ota -t upload`. Set upload_port to the device IP/hostname and
; --auth to the OTA_PASSWORD from include/secrets.h.
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = dvs-sniffer.local
upload_flags =
    --auth=change-me

; Native environment for host-side unit tests (CRC + frame decoding).
; Runs on the build machine with `pio test -e native`; needs no hardware.
[env:native]
platform = native
test_framework = unity
; Compile src/ into the test binary so it can exercise crc16.cpp / frame.cpp.
; main.cpp is guarded out with UNIT_TEST so the Arduino entry point is skipped.
test_build_src = yes
build_flags =
  -std=gnu++17
  -DUNIT_TEST